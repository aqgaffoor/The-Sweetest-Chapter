<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#fdf0ed"/>

  <!-- Candle flame -->
  <ellipse cx="32" cy="10" rx="3" ry="4.5" fill="#f9c74f" opacity="0.95"/>
  <ellipse cx="32" cy="11.5" rx="1.8" ry="2.8" fill="#f8961e"/>

  <!-- Candle body -->
  <rect x="29.5" y="13" width="5" height="8" rx="2" fill="#d98c8c"/>

  <!-- Top frosting drips -->
  <path
    d="M14 25
       Q16 22 18 25
       Q20 22 22 25
       Q24 22 26 25
       Q28 22 30 25
       Q32 22 34 25
       Q36 22 38 25
       Q40 22 42 25
       Q44 22 46 25
       Q48 22 50 25
       L50 30 Q50 32 48 32
       L16 32 Q14 32 14 30 Z"
    fill="#f5c2c7"/>

  <!-- Cake top layer -->
  <rect x="14" y="30" width="36" height="11" rx="2" fill="#ffffff" stroke="#f4dede" stroke-width="0.5"/>

  <!-- Cake middle layer -->
  <rect x="11" y="39" width="42" height="13" rx="2" fill="#fdf0ed" stroke="#f4dede" stroke-width="0.5"/>

  <!-- Bottom plate -->
  <rect x="8" y="51" width="48" height="5" rx="2.5" fill="#b08d57"/>
  <rect x="10" y="53" width="44" height="1.5" rx="0.75" fill="#d4bc96" opacity="0.6"/>

  <!-- Frosting stripe on top layer -->
  <rect x="14" y="35" width="36" height="2" rx="1" fill="#f4dede" opacity="0.7"/>

  <!-- Gold dots decoration -->
  <circle cx="22" cy="45" r="2" fill="#b08d57"/>
  <circle cx="32" cy="45" r="2" fill="#b08d57"/>
  <circle cx="42" cy="45" r="2" fill="#b08d57"/>

  <!-- Small sprinkle dots on top layer -->
  <circle cx="21" cy="33" r="1.2" fill="#d98c8c"/>
  <circle cx="28" cy="31.5" r="1"  fill="#b08d57"/>
  <circle cx="35" cy="33" r="1.2" fill="#d98c8c"/>
  <circle cx="43" cy="31.5" r="1"  fill="#b08d57"/>

</svg>